name: Commit release evidence

on:
  push:
    branches: [feat/reentry-production-vertical-slice]
    paths: [".github/workflows/release-evidence.yml"]

permissions:
  actions: read
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reentry-production-vertical-slice
          fetch-depth: 0
      - name: Download exact green browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 29971460075 -n reentry-playwright-evidence -D /tmp/evidence
      - name: Install screenshots
        shell: bash
        run: |
          mkdir -p docs/evidence
          cp "$(find /tmp/evidence -name client-day-2.png -print -quit)" docs/evidence/client-day-2.png
          cp "$(find /tmp/evidence -name provider-issued.png -print -quit)" docs/evidence/provider-issued.png
          sha256sum docs/evidence/*.png > docs/evidence/SHA256SUMS
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence
          git commit -m "docs: add verified provider and client screenshots"
          git push origin HEAD:feat/reentry-production-vertical-slice
