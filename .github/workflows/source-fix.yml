name: Apply source repair

on:
  push:
    branches: [feat/reentry-production-vertical-slice]
    paths: [".fix/**", ".github/workflows/source-fix.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reentry-production-vertical-slice
          fetch-depth: 0
      - run: python .fix/apply.py
      - run: rm -rf .fix
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy purity checks and resolve test aliases"
          git push origin HEAD:feat/reentry-production-vertical-slice
