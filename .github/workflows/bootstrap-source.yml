name: Bootstrap source

on:
  push:
    branches:
      - feat/reentry-production-vertical-slice
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reentry-production-vertical-slice
          fetch-depth: 0
      - name: Expand source archive
        shell: bash
        run: |
          cat .bootstrap/reentry.part* | base64 --decode > /tmp/reentry-source.tar.gz
          tar -xzf /tmp/reentry-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit production slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement RE:ENTRY production vertical slice"
          git push origin HEAD:feat/reentry-production-vertical-slice
